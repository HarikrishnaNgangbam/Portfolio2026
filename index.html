<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <!--
      No static title/description/OG tags here — every route renders its own
      via the <Seo> component (src/components/seo.tsx), which React 19 hoists
      into <head>. A static <title> here would keep sitting alongside the
      React-rendered one (React can't dedupe a tag it didn't render), so it's
      left to Seo — the app hydrates fast enough that there's no meaningful
      blank-tab window in practice.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
